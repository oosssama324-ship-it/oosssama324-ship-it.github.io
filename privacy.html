<h1>سياسة الخصوصية - لعبة الذاكرة</h1>
<p>لا تجمع هذه اللعبة أي بيانات شخصية، ولا تطلب أي أذونات، ولا تحتوي على إعلانات أو أدوات تتبع.</p>
<p>تُحفظ أفضل نتيجة لك على جهازك فقط، ولا تُرسل إلى أي خادم.</p>
<p>إذا كانت لديك أسئلة، تواصل معنا على: <b>ضع بريدك الإلكتروني هنا</b></p>
